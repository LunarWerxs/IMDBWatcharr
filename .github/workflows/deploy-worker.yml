name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify parser fixtures
        run: npm run check

      # A revoked token is an unset credential, not a broken build. Failing here
      # paints main red forever and trains everyone to ignore the deploy result,
      # which is worse than saying plainly that there is nothing to deploy with.
      - name: Check the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" = "200" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            # A token that is PRESENT and REJECTED is not the same thing as a
            # token that was never set. The first is a deploy that used to work
            # and silently stopped; warning-and-green there means the tick says
            # "shipped" while nothing shipped, which is exactly how this went
            # unnoticed until 2026-08-17. Absent stays a warning; rejected is red.
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN is rejected by Cloudflare (HTTP $status). The Worker was NOT deployed and the live site is now behind this commit. Rotate the token to re-enable this deploy."
            exit 1
          fi

      - name: Deploy Worker
        if: steps.token.outputs.usable == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
