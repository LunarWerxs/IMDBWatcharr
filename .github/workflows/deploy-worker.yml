name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify parser fixtures
        run: npm run check

      # A revoked token is an unset credential, not a broken build. Failing here
      # paints main red forever and trains everyone to ignore the deploy result,
      # which is worse than saying plainly that there is nothing to deploy with.
      - name: Check the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."
            exit 0
          fi
          # NO /user/tokens/verify PRECHECK. That endpoint validates classic
          # API tokens only, and answers 401 "Invalid API Token" for a
          # credential that is valid but of another type - proven 2026-08-17
          # against a credential that could list every Worker in the account
          # seconds later. Gating on it blocks working deploys and reports a
          # healthy token as dead, which is exactly what happened here.
          # wrangler is the honest test: if it cannot deploy, the deploy step
          # fails with the real reason instead of a guess.
          echo "usable=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        if: steps.token.outputs.usable == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
