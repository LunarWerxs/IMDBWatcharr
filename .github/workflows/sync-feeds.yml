name: Sync feeds

# IMDb blocks Cloudflare's egress, so the Worker cannot fetch its own data.
# This runner does the fetching and pushes snapshots to the Worker's /api/ingest.
on:
  schedule:
    # Every 15 minutes. Free on a public repo, and well inside the six-hour
    # freshness the feeds already promised. GitHub delays scheduled runs under
    # load, so treat the cadence as a floor rather than a clock.
    - cron: "*/15 * * * *"
  # The Worker dispatches this with scope=requested when someone pastes a list,
  # so a new list fills in about a minute instead of on the next tick. By hand,
  # leave it on `all`.
  workflow_dispatch:
    inputs:
      scope:
        description: "all = every claimed feed plus the queue; requested = the queue only"
        required: false
        default: all
        type: choice
        options: [all, requested]

concurrency:
  # Snapshots are last-writer-wins per feed, so overlapping runs would just
  # duplicate work. Never cancel a run in flight: it may be mid-ingest. A burst
  # of dispatches collapses into one pending run, which is enough: every run
  # reads the whole queue.
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Sync feeds from IMDb
        env:
          WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN || 'https://watcharr.lunarwerx.com' }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SYNC_SCOPE: ${{ github.event.inputs.scope || 'all' }}
        run: node scripts/sync-feeds.mjs
