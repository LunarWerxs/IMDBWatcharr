      <main>
        <section aria-labelledby="what-it-does">
          <h2 id="what-it-does">What it does</h2>
          <p>
            IMDb Watcharr turns a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr
            custom list. It is a LunarWerx product for people who keep a watchlist or list on IMDb and
            want Radarr and Sonarr to pick up the same titles automatically.
          </p>
          <p>
            Paste a public IMDb watchlist (imdb.com/user/ur.../watchlist/) or list
            (imdb.com/list/ls.../) URL and get two links back: one Radarr reads as an RSS List for the
            movies, one Sonarr reads as a Custom List for the shows. The links are derived from the
            IMDb list, so the same list always gives you the same two links.
          </p>
          <ul>
            <li>Works without an account: both links work immediately and keep working</li>
            <li>
              Sign in with Connections and the list is checked and refreshed automatically, about
              every fifteen minutes
            </li>
            <li>Radarr: Settings, Lists, Add list, Advanced, RSS List</li>
            <li>Sonarr: Settings, Import Lists, Add list, Advanced, Custom List</li>
            <li>
              If a scheduled refresh fails, the feeds keep serving the last good snapshot instead of
              breaking
            </li>
            <li>
              Sonarr needs a TVDB id per show; any show IMDb Watcharr cannot resolve is skipped and
              reported rather than passed along broken
            </li>
            <li>Free, source-available on GitHub (version 1.0.0), and self-hostable</li>
          </ul>
        </section>

        <section aria-labelledby="how-it-compares">
          <h2 id="how-it-compares">How it compares</h2>
          <ul>
            <li>
              <strong>Radarr's and Sonarr's own IMDb list import.</strong> Sonarr removed its built-in
              IMDb list import in 2025, and Radarr's IMDb list-ID import stopped working after
              IMDb changed its export format. IMDb Watcharr fills that gap instead: a GitHub Actions runner does the IMDb fetch and republishes the result as one
              Radarr RSS feed and one Sonarr Custom List, generated together from a single pasted
              URL, with the last good snapshot served if a sync ever fails.
            </li>
            <li>
              <strong>Trakt-based syncing.</strong> A common alternative routes an IMDb watchlist
              through Trakt.tv, then points Radarr and Sonarr at a Trakt list. That works, but it is
              a second account and an extra hop. IMDb Watcharr goes straight from the IMDb URL to
              two ready-to-use links, no Trakt account required.
            </li>
            <li>
              <strong>Copying titles by hand.</strong> The default without any tool: re-typing or
              re-copying titles into Radarr and Sonarr every time the IMDb list changes. A feed
              claimed in IMDb Watcharr updates on its own, about every fifteen minutes.
            </li>
          </ul>
        </section>

        <section aria-labelledby="faq">
          <h2 id="faq">Frequently asked questions</h2>

          <h3>Is IMDb Watcharr free?</h3>
          <p>
            Yes. IMDb Watcharr has no paid tier and no payment set up anywhere in the app. It is
            free to use, and the source is available on GitHub so it can be self-hosted for free
            too. It is built as a personal, non-commercial tool: IMDb's own API terms forbid public
            or commercial use of its data.
          </p>

          <h3>Do I need an account to use IMDb Watcharr?</h3>
          <p>
            No. Paste a public IMDb watchlist or list URL and get two working links back
            immediately, no sign-up required. Signing in with Connections is optional, and it only
            changes one thing: it puts that feed on the automatic refresh schedule, re-checked
            roughly every fifteen minutes instead of staying on its original snapshot.
          </p>

          <h3>How do I add an IMDb list to Radarr?</h3>
          <p>
            In Radarr, open Settings, then Lists, then Add List, switch to Advanced, and choose RSS
            List. Paste the Radarr URL that IMDb Watcharr generated for your list. It is derived
            from the IMDb list itself, so it never changes and never needs replacing later.
          </p>

          <h3>How do I add an IMDb list to Sonarr?</h3>
          <p>
            In Sonarr, open Settings, then Import Lists, then Add List, switch to Advanced, and
            choose Custom List. Paste the Sonarr URL that IMDb Watcharr generated. It is a separate
            link from the Radarr one, since Sonarr needs TVDB show data rather than the movie data
            Radarr reads.
          </p>

          <h3>Why is a show missing from my Sonarr list?</h3>
          <p>
            Sonarr needs a TVDB id for every show, and IMDb Watcharr resolves those through TVMaze,
            but not every IMDb title maps to one. Any show it cannot match is left out of the
            Sonarr list rather than passed along broken, and the app reports how many titles were
            skipped on each sync.
          </p>

          <h3>How is IMDb Watcharr different from adding an IMDb list to Radarr or Sonarr directly?</h3>
          <p>
            Sonarr removed its built-in IMDb list import in 2025, and Radarr's IMDb list-ID import
            stopped working after IMDb changed its export format. IMDb Watcharr fills that gap: a GitHub Actions runner does the IMDb fetch, and IMDb
            Watcharr republishes it as one Radarr RSS feed and one Sonarr Custom List from a single
            pasted URL, keeping the last good snapshot if a sync ever fails.
          </p>

          <h3>Does IMDb Watcharr work offline, or can I self-host it?</h3>
          <p>
            It can't run offline. Creating a feed needs the live site, and refreshing a claimed
            feed needs the scheduled GitHub Actions sync. But the code is source-available on
            GitHub, so you can self-host the whole thing, Cloudflare Worker, D1 database, and sync
            job, instead of using the hosted version.
          </p>

          <h3>Why does a list I just pasted return an error?</h3>
          <p>
            A brand-new list is not instant. The site cannot fetch IMDb directly, so a freshly
            pasted URL is queued, and the Radarr and Sonarr routes answer 503 until the next sync
            fills the list in. Once it has synced, the two links keep serving that snapshot even if
            a later sync fails.
          </p>
        </section>

#lwdc-badge.lwdc-light #lwdc-x{border-color:rgba(15,23,42,.15);background:#fff;color:#64748b}
#lwdc-badge.lwdc-light #lwdc-x:hover,#lwdc-badge.lwdc-light #lwdc-x:focus-visible{border-color:rgba(15,23,42,.3);color:#0f172a}
</style>
<script>
(function () {
  var KEY = 'lw:discord-badge-dismissed';
  var el = document.getElementById('lwdc-badge');
  if (!el) return;
  // Wrapped because Safari with storage blocked THROWS on access rather than
  // returning null, and a social badge must never be able to break a page.
  function got(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  if (got(KEY) === '1') return;

  /* Which skin. Measured, not configured: walk up from <body> to the first
     element with a real background and score its luminance. That covers a site
     that is always light, a site that is always dark, and a site that follows
     the OS, with no per-site list to keep in sync. Anything unreadable falls
     through to the dark skin, which is what most of these pages want. */
  function luminance() {
    var node = document.body;
    while (node) {
      var bg = getComputedStyle(node).backgroundColor;
      var m = /rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s\/]+([\d.]+))?/.exec(bg || '');
      if (m && (m[4] === undefined || parseFloat(m[4]) > 0.1)) {
        return (0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3]) / 255;
      }
      node = node.parentElement;
    }
    return 0;
  }
  function skin() { try { if (luminance() > 0.55) el.classList.add('lwdc-light'); } catch (e) {} }

  setTimeout(function () {
    skin();
    el.hidden = false;
    // Next frame, so the transition has a start state to move from.
    requestAnimationFrame(function () { el.classList.add('lwdc-in'); });
  }, 1400);

  // Re-measure if the page's own theme flips underneath us.
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        el.classList.remove('lwdc-light'); skin();
      });
    } catch (e) { /* older Safari lacks addEventListener here; the initial skin stands */ }
  }

  document.getElementById('lwdc-x').addEventListener('click', function () {
    el.classList.remove('lwdc-in');
    setTimeout(function () { el.hidden = true; }, 280);
    try { localStorage.setItem(KEY, '1'); } catch (e) { /* blocked; gone for this page anyway */ }
  });
})();
</script>
<!-- /LunarWerx Discord badge -->
</body>
</html>
