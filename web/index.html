<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LunarWerx slate-950, so the browser chrome matches the page. -->
    <meta name="theme-color" content="#020617" />
    <meta name="author" content="LunarWerx" />
    <meta
      name="description"
      content="IMDb Watcharr turns a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <title>IMDb Watcharr - IMDb lists for Radarr and Sonarr - LunarWerx</title>

    <!-- A shared link is most of how anyone meets this, so it carries the full
         product name and the studio rather than a bare hostname. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LunarWerx" />
    <meta property="og:title" content="IMDb Watcharr" />
    <meta
      property="og:description"
      content="Turn a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <meta property="og:url" content="https://watcharr.lunarwerx.com" />
    <!-- Raster PNG, not the SVG next to it: most platforms will not render an
         SVG og:image. Regenerate from og-image.svg with `npm run og`. -->
    <meta property="og:image" content="https://watcharr.lunarwerx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IMDb Watcharr, a LunarWerx product" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IMDb Watcharr" />
    <meta
      name="twitter:description"
      content="Turn a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <meta name="twitter:image" content="https://watcharr.lunarwerx.com/og-image.png" />
    <link rel="canonical" href="https://watcharr.lunarwerx.com/" />

    <!-- ARGUS Analytics Pixel (Connections, analytics.connections.icu).
         The key is a PUBLIC ingest key and is meant to ship in client JS.
         Honours DNT and Sec-GPC by itself, and is grant-by-default outside the
         EU/EEA/UK/CH (the pixel is stamped per-visitor at the edge). localhost
         is skipped so a local preview cannot inflate the numbers. -->
    <script>
        (function (w, d, k) {
            function warn(msg, err) {
                try {
                    if (w.console && typeof w.console.warn === 'function') {
                        if (err) { w.console.warn(msg, err); } else { w.console.warn(msg); }
                    }
                } catch (e0) { }
            }
            try {
                var key = (typeof k === 'string') ? k.replace(/^\s+|\s+$/g, '') : '';
                if (!key || key === 'ak_YOUR_SITE_KEY') {
                    warn('[ARGUS] missing or placeholder pixel key; pixel not installed');
                    return;
                }
                if (d.getElementById('argus-pixel')) { return; }
                var host = w.location.hostname;
                if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host.endsWith('.local')) { return; }
                var P = w.ArgusPixel = w.ArgusPixel || {};
                P.key = key;
                var j = d.createElement('script');
                j.async = true;
                j.id = 'argus-pixel';
                j.type = 'text/javascript';
                // ?v= is the cache-bust lever: the pixel is served max-age=3600
                // from ONE origin shared by every tracked site, so bump this when
                // a pixel change has to reach existing readers now.
                j.src = 'https://analytics.connections.icu/pixel.js?v=2';
                j.onerror = function () { warn('[ARGUS] pixel.js failed to load (check CSP script-src / network / ad-blocker)'); };
                var mount = d.head || d.getElementsByTagName('head')[0] || d.documentElement || d.body;
                if (!mount) { warn('[ARGUS] no DOM mount point for pixel; skipping'); return; }
                mount.appendChild(j);
            } catch (e) {
                warn('[ARGUS] pixel install failed', e);
            }
        })(window, document, 'ak_52b4c1d671399ccdcda72404038979bb435c');
    </script>
    <!-- End ARGUS Analytics Pixel -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
