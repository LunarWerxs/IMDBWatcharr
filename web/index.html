<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LunarWerx slate-950, so the browser chrome matches the page. -->
    <meta name="theme-color" content="#020617" />
    <meta name="author" content="LunarWerx" />
    <meta
      name="description"
      content="IMDb Watcharr turns a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <title>IMDb Watcharr - IMDb lists for Radarr and Sonarr - LunarWerx</title>

    <!-- A shared link is most of how anyone meets this, so it carries the full
         product name and the studio rather than a bare hostname. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LunarWerx" />
    <meta property="og:title" content="IMDb Watcharr" />
    <meta
      property="og:description"
      content="Turn a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <meta property="og:url" content="https://watcharr.lunarwerx.com" />
    <!-- Raster PNG, not the SVG next to it: most platforms will not render an
         SVG og:image. Regenerate from og-image.svg with `npm run og`. -->
    <meta property="og:image" content="https://watcharr.lunarwerx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IMDb Watcharr, a LunarWerx product" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IMDb Watcharr" />
    <meta
      name="twitter:description"
      content="Turn a public IMDb watchlist or list into a Radarr RSS feed and a Sonarr custom list. A LunarWerx product."
    />
    <meta name="twitter:image" content="https://watcharr.lunarwerx.com/og-image.png" />
    <link rel="canonical" href="https://watcharr.lunarwerx.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
