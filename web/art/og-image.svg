<!--
  Share card source. Regenerate the PNG with `npm run og`.

  Most platforms will not render an SVG og:image, so the PNG next to this file is
  the one that actually ships; this stays as the editable original.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#121212"/>

  <!-- A single soft yellow wash, matching the accent, so the card is not a flat block. -->
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- The Watcharr mark, the same one as the favicon and the header. It is
       generated: the logo repo's tools/marks_watcharr.py fills this block. -->
  <!-- watcharr-mark x=88 y=86 size=76 ink=#ffffff -->
