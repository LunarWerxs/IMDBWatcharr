  <!-- /watcharr-mark -->

  <text x="184" y="126" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="0.5">Watch<tspan fill="#f5c518">arr</tspan></text>
  <text x="184" y="158" fill="#a8a8a8" font-size="21">a LunarWerx product</text>

  <text x="88" y="300" fill="#ffffff" font-size="66" font-weight="700">Your IMDb list, straight into</text>
  <text x="88" y="378" fill="#ffffff" font-size="66" font-weight="700">Radarr and Sonarr.</text>

  <text x="88" y="452" fill="#a8a8a8" font-size="27">Paste a public watchlist or list. Get one link for the movies,</text>
  <text x="88" y="490" fill="#a8a8a8" font-size="27">one for the shows. Both read the same list.</text>

  <rect x="88" y="536" width="9" height="34" rx="4.5" fill="#f5c518"/>
  <text x="112" y="562" fill="#ffffff" font-size="25" font-weight="600">watcharr.lunarwerx.com</text>
</svg>
