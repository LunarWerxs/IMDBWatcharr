  <!-- /watcharr-mark -->

  <text x="92" y="278" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-1">IMDb Watcharr</text>
  <text x="92" y="330" fill="#a8a8a8" font-size="28">Your IMDb list, straight into Radarr and Sonarr.</text>

  <!-- Chip row, matching the other banners. The last one is the accent. -->
  <g font-size="21" font-weight="700">
    <rect x="92" y="376" width="112" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="148" y="409" fill="#e6e6e6" text-anchor="middle">IMDb</text>

    <rect x="220" y="376" width="132" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="286" y="409" fill="#e6e6e6" text-anchor="middle">Radarr</text>

    <rect x="368" y="376" width="132" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="434" y="409" fill="#e6e6e6" text-anchor="middle">Sonarr</text>

    <rect x="516" y="376" width="196" height="52" rx="12" fill="#f5c518"/>
    <text x="614" y="409" fill="#000000" text-anchor="middle">Auto-refresh</text>
  </g>
</svg>
