<!--
  Portfolio banner for the lunarwerx.com catalog card. 1200x520, matching the
  other product banners. Rendered to PNG by `npm run og`, which also copies it
  into the LunarWerx site's public/banners.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Faint grid, the texture the other banners share. -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="0.14" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="520" fill="#121212"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <rect width="1200" height="520" fill="url(#wash)"/>

  <!-- Product mark, the same one as the favicon and the header. It is generated:
       the logo repo's tools/marks_watcharr.py fills this block. -->
