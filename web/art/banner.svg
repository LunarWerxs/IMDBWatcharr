<!--
  Portfolio banner for the lunarwerx.com catalog card. 1200x520, matching the
  other product banners. Rendered to PNG by `npm run og`, which also copies it
  into the LunarWerx site's public/banners.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Faint grid, the texture the other banners share. -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="0.14" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="520" fill="#121212"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <rect width="1200" height="520" fill="url(#wash)"/>

  <!-- Product mark, the same one as the favicon and the header. It is generated:
       the logo repo's tools/marks_watcharr.py fills this block. -->
  <!-- watcharr-mark x=92 y=46 size=120 ink=#ffffff -->
  <svg x="92" y="46" width="120" height="120" viewBox="388.15 383 247.7 247.7"><path d="M422.0 411.0L422.5 405.9L423.5 402.0L425.6 397.3L428.5 393.1L432.1 389.5L435.4 387.1L440.0 384.8L444.9 383.5L450.0 383.0L548.0 383.0L551.0 383.8L552.6 385.1L553.6 386.9L554.0 389.0L554.0 539.7L553.1 543.8L550.7 547.1L548.1 548.8L546.1 549.5L543.0 549.6L539.9 548.8L492.0 521.3L490.1 520.5L487.0 520.3L484.0 521.3L422.0 557.0Z" fill="#F5C518"/><path d="M422.0 616.7L422.4 619.9L423.3 622.7L424.9 625.3L427.6 628.0L430.3 629.5L433.3 630.5L436.4 630.7L440.1 630.1L443.1 628.8L507.0 591.9L509.8 590.8L512.1 590.6L515.0 591.0L517.0 591.9L582.9 629.8L587.6 630.7L591.8 630.2L596.2 628.1L599.2 625.1L601.4 620.8L602.0 616.7L602.0 404.1L601.2 399.0L599.3 394.4L596.9 390.9L593.2 387.4L587.9 384.5L582.0 383.1L572.4 383.1L570.9 383.9L570.1 385.4L570.0 540.5L569.6 544.3L568.4 548.6L566.9 552.0L564.6 555.6L562.0 558.5L558.6 561.2L552.8 564.2L545.9 565.6L542.1 565.6L537.8 565.0L534.3 563.8L531.0 562.2L489.5 538.3L488.1 537.9L486.8 538.2L422.6 575.3L422.0 577.2Z" fill="#ffffff"/></svg>
  <!-- /watcharr-mark -->

  <text x="92" y="278" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-1">Watch<tspan fill="#f5c518">arr</tspan></text>
  <text x="92" y="330" fill="#a8a8a8" font-size="28">Your IMDb list, straight into Radarr and Sonarr.</text>

  <!-- Chip row, matching the other banners. The last one is the accent. -->
  <g font-size="21" font-weight="700">
    <rect x="92" y="376" width="112" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="148" y="409" fill="#e6e6e6" text-anchor="middle">IMDb</text>

    <rect x="220" y="376" width="132" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="286" y="409" fill="#e6e6e6" text-anchor="middle">Radarr</text>

    <rect x="368" y="376" width="132" height="52" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="434" y="409" fill="#e6e6e6" text-anchor="middle">Sonarr</text>

    <rect x="516" y="376" width="196" height="52" rx="12" fill="#f5c518"/>
    <text x="614" y="409" fill="#000000" text-anchor="middle">Auto-refresh</text>
  </g>
</svg>
